
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>game.md · Markdown</title>

  <link rel="stylesheet" href="./github-markdown.min.css">
  <link rel="stylesheet" href="./github.min.css" id="hljs-light">
  <link rel="stylesheet" href="./github-dark.min.css" id="hljs-dark" disabled>

  <style>
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --page: #ffffff;
      --panel: #f6f8fa;
      --border: #d1d9e0;
      --text: #1f2328;
      --muted: #59636e;
      --link: #0969da;
      --hover: #eff2f5;
      --code-bg: #f6f8fa;
      --quote: #59636e;
      --table-alt: #f6f8fa;
      --active-bg: #ddf4ff;
      --button-bg: #f6f8fa;
      --button-hover: #eaeef2;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --page: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9198a1;
      --link: #4493f8;
      --hover: #21262d;
      --code-bg: #161b22;
      --quote: #9198a1;
      --table-alt: #161b22;
      --active-bg: #12283a;
      --button-bg: #21262d;
      --button-hover: #30363d;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-padding-top: 76px;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--page);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont,
        "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1280px;
      min-height: 62px;
      margin: auto;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .repo-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--page);
      color: var(--text);
      font-size: 18px;
    }

    .repo-title {
      min-width: 0;
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .repo-title span {
      color: var(--muted);
      font-weight: 400;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      background: var(--button-bg);
      font: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    button:hover {
      background: var(--button-hover);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
    }

    .layout {
      max-width: 1280px;
      margin: 24px auto;
      padding: 0 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      gap: 24px;
      align-items: start;
    }

    .main {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--page);
    }

    .file-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      background: var(--page);
      font-weight: 600;
    }

    .file-header small {
      margin-left: auto;
      color: var(--muted);
      font-weight: 400;
    }

    .markdown-body {
      min-height: 220px;
      padding: 32px;
      color: var(--text) !important;
      background: var(--page) !important;
      font-size: 14px;
    }

    .markdown-body,
    .markdown-body * {
      border-color: var(--border);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6,
    .markdown-body p,
    .markdown-body li,
    .markdown-body dt,
    .markdown-body dd,
    .markdown-body strong,
    .markdown-body b,
    .markdown-body em,
    .markdown-body i,
    .markdown-body label,
    .markdown-body summary,
    .markdown-body details {
      color: var(--text);
    }

    .markdown-body a {
      color: var(--link);
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body hr {
      height: 1px;
      background: var(--border);
      border: 0;
    }

    .markdown-body blockquote {
      color: var(--quote);
      border-left-color: var(--border);
    }

    .markdown-body blockquote p {
      color: var(--quote);
    }

    .markdown-body table {
      display: block;
      width: max-content;
      max-width: 100%;
      overflow: auto;
      border-spacing: 0;
      border-collapse: collapse;
    }

    .markdown-body table th,
    .markdown-body table td {
      padding: 6px 13px;
      border: 1px solid var(--border);
    }

    .markdown-body table tr {
      color: var(--text);
      background: var(--page);
      border-top: 1px solid var(--border);
    }

    .markdown-body table tr:nth-child(2n) {
      background: var(--table-alt);
    }

    .markdown-body code,
    .markdown-body tt {
      color: var(--text);
      background: var(--code-bg);
    }

    .markdown-body code:not(pre code) {
      padding: .15em .35em;
      border-radius: 4px;
    }

    .markdown-body pre {
      max-width: 100%;
      overflow: auto;
      padding: 16px;
      color: var(--text);
      background: var(--code-bg) !important;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .markdown-body pre code {
      padding: 0;
      color: inherit;
      background: transparent !important;
      border: 0;
    }

    .markdown-body pre code.hljs {
      padding: 0;
      background: transparent !important;
    }

    .markdown-body img,
    .markdown-body video,
    .markdown-body iframe {
      max-width: 100%;
    }

    .markdown-body img {
      height: auto;
    }

    .markdown-body input[type="checkbox"] {
      accent-color: var(--link);
    }

    .markdown-body input:not([type="checkbox"]),
    .markdown-body textarea,
    .markdown-body select {
      max-width: 100%;
      color: var(--text);
      background: var(--page);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .markdown-body kbd {
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: inset 0 -1px var(--border);
    }

    .markdown-body .highlight,
    .markdown-body .blob-wrapper,
    .markdown-body .snippet-clipboard-content {
      color: var(--text);
      background: var(--code-bg);
    }

    .toc {
      position: sticky;
      top: 86px;
      max-height: calc(100vh - 110px);
      overflow: auto;
      color: var(--text);
    }

    .toc h3 {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .toc nav {
      border-left: 1px solid var(--border);
    }

    .toc a {
      display: block;
      margin-left: -1px;
      padding: 5px 10px;
      overflow-wrap: anywhere;
      color: var(--muted);
      border-left: 2px solid transparent;
      border-radius: 0 4px 4px 0;
      font-size: 12px;
      text-decoration: none;
    }

    .toc a:hover {
      color: var(--link);
      background: var(--hover);
    }

    .toc a.active {
      color: var(--link);
      background: var(--active-bg);
      border-left-color: var(--link);
      font-weight: 600;
    }

    .status {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      background: var(--panel);
      font-size: 12px;
    }

    .error {
      margin: 20px;
      padding: 16px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    .error strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    .loading {
      padding: 40px 20px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      max-width: 1280px;
      margin: 0 auto 30px;
      padding: 0 24px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 850px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
        margin-top: 16px;
        padding: 0 12px;
      }

      .toc {
        position: static;
        order: -1;
        max-height: none;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--page);
      }

      .toc:empty {
        display: none;
      }

      .markdown-body {
        padding: 20px 16px;
      }

      .topbar-inner {
        padding: 10px 12px;
      }
    }

    @media (max-width: 480px) {
      .repo-title {
        font-size: 14px;
      }

      .actions button {
        padding: 6px 8px;
      }

      .actions .reload-label {
        display: none;
      }
    }
    .markdown-body mark {
  color: #1f2328 !important;
  background-color: #fff8c5 !important;
  padding: 0.12em 0.3em;
  border-radius: 4px;
}

[data-theme="dark"] .markdown-body mark {
  color: #e6edf3 !important;
  background-color: #2b2625 !important;
}
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="repo-icon" aria-hidden="true">⌘</div>

      <div class="repo-title">
        game.md <span>/ README</span>
      </div>

      <div class="actions">
        <button id="themeBtn" type="button">☾ 深色主题</button>
        <button id="reloadBtn" type="button">
          ↻ <span class="reload-label">重新加载</span>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <div class="file-header">
        <span aria-hidden="true">▤</span>
        game.md
        <small id="fileInfo">正在读取…</small>
      </div>

      <article id="content" class="markdown-body">
        <div class="loading">正在加载 Markdown…</div>
      </article>

      <div class="status" id="status">正在读取 ./game.md</div>
    </main>

    <aside class="toc" id="toc" aria-label="目录"></aside>
  </div>

  <div class="footer">Game Markdown</div>

  <script src="./marked.min.js"></script>
  <script src="./purify.min.js"></script>
  <script src="./highlight.min.js"></script>

  <script>
    const content = document.getElementById('content');
    const status = document.getElementById('status');
    const fileInfo = document.getElementById('fileInfo');
    const toc = document.getElementById('toc');

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function slugify(text) {
      return text.toLowerCase().trim()
        .replace(/[^\w\u00C0-\u024F\u4e00-\u9fff -]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
    }

    function renderToc() {
      const headings = [
        ...content.querySelectorAll('h1, h2, h3, h4, h5, h6')
      ];

      const used = new Map();

      headings.forEach(heading => {
        const base = slugify(heading.textContent) || 'section';
        const count = used.get(base) || 0;

        used.set(base, count + 1);
        heading.id = count ? `${base}-${count}` : base;
      });

      if (!headings.length) {
        toc.innerHTML = '';
        return;
      }

      toc.innerHTML =
        '<h3>目录</h3><nav>' +
        headings.map(heading => {
          const level = Number(heading.tagName.slice(1));

          return `<a href="#${encodeURIComponent(heading.id)}"
            style="padding-left:${10 + (level - 1) * 12}px">${escapeHtml(heading.textContent)}</a>`;
        }).join('') +
        '</nav>';

      toc.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', event => {
          const id = decodeURIComponent(link.hash.slice(1));
          const target = document.getElementById(id);

          if (!target) return;

          event.preventDefault();
          target.scrollIntoView({ behavior: 'auto', block: 'start' });
          history.replaceState(null, '', '#' + encodeURIComponent(id));
          setActiveToc(link);
        });
      });
    }

    function setActiveToc(activeLink) {
      toc.querySelectorAll('a').forEach(link => {
        link.classList.toggle('active', link === activeLink);
      });
    }

    function setupTocTracking() {
      if (!('IntersectionObserver' in window)) return;

      const headings = content.querySelectorAll(
        'h1, h2, h3, h4, h5, h6'
      );

      const observer = new IntersectionObserver(entries => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) =>
            a.boundingClientRect.top - b.boundingClientRect.top
          );

        if (!visible.length) return;

        const id = visible[0].target.id;

        const link = [...toc.querySelectorAll('a')].find(item =>
          decodeURIComponent(item.hash.slice(1)) === id
        );

        if (link) setActiveToc(link);
      }, {
        rootMargin: '-76px 0px -75% 0px',
        threshold: 0
      });

      headings.forEach(heading => observer.observe(heading));
    }

    function highlightCode() {
      if (!window.hljs) return;

      content.querySelectorAll('pre code').forEach(block => {
        try {
          hljs.highlightElement(block);
        } catch (error) {
          console.warn('代码高亮失败：', error);
        }
      });
    }

    async function loadMarkdown() {
      content.innerHTML =
        '<div class="loading">正在加载 Markdown…</div>';

      status.textContent = '正在读取 ./game.md';
      fileInfo.textContent = '正在读取…';

      try {
        const response = await fetch('./game.md', {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            `HTTP ${response.status} ${response.statusText}`
          );
        }

        const markdown = await response.text();

        if (!window.marked || !window.DOMPurify) {
          throw new Error(
            'Markdown 解析库加载失败，请检查网络或 CDN 是否可访问。'
          );
        }

        marked.setOptions({
          gfm: true,
          breaks: false
        });

        const rawHtml = marked.parse(markdown);

        content.innerHTML = DOMPurify.sanitize(rawHtml, {
          USE_PROFILES: { html: true },
          ADD_ATTR: ['target', 'rel']
        });

        content.querySelectorAll('a[href]').forEach(link => {
          const href = link.getAttribute('href') || '';

          if (/^https?:\/\//i.test(href)) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
        });

        content.querySelectorAll('input[type="checkbox"]').forEach(input => {
          input.disabled = true;
        });

        renderToc();
        highlightCode();
        setupTocTracking();

        const bytes = new Blob([markdown]).size;
        const lines = markdown.split(/\r?\n/).length;

        fileInfo.textContent = `${lines} 行`;
        status.textContent =
          `已加载 game.md · ${(bytes / 1024).toFixed(1)} KB`;

      } catch (error) {
        toc.innerHTML = '';

        content.innerHTML = `
          <div class="error">
            <strong>无法加载 ./game.md</strong>
            <div>${escapeHtml(error.message || error)}</div>
            <p>
              请确认 game.md 与本 HTML 文件位于同一目录，
              并通过本地 HTTP 服务器或网站访问。
              直接双击 HTML（file://）通常会被浏览器阻止读取本地文件。
            </p>
          </div>
        `;

        fileInfo.textContent = '加载失败';
        status.textContent = '读取失败';
      }
    }

    function setTheme(theme) {
      const root = document.documentElement;

      root.dataset.theme = theme;

      document.getElementById('hljs-light').disabled =
        theme === 'dark';

      document.getElementById('hljs-dark').disabled =
        theme !== 'dark';

      const button = document.getElementById('themeBtn');

      button.textContent =
        theme === 'dark' ? '☀ 浅色主题' : '☾ 深色主题';

      button.setAttribute(
        'aria-label',
        theme === 'dark' ? '切换到浅色主题' : '切换到深色主题'
      );
    }

    document.getElementById('themeBtn').addEventListener('click', () => {
      const current = document.documentElement.dataset.theme;
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    document.getElementById('reloadBtn').addEventListener(
      'click',
      loadMarkdown
    );

    setTheme(
      window.matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light'
    );

    loadMarkdown();
  </script>
</body>
</html>
